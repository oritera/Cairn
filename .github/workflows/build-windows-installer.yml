name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build app and installer
        shell: pwsh
        run: .\desktop\build.ps1

      - name: Locate installer
        id: find
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\Cairn-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw 'installer was not produced' }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find.outputs.name }}
          path: ${{ steps.find.outputs.path }}
          if-no-files-found: error

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.path }}

      - name: Publish rolling "windows-latest" pre-release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Cairn for Windows (latest build from main)
          prerelease: true
          files: ${{ steps.find.outputs.path }}
